name: Build Live San Dau APK

on:
  push:
    branches: [build/live-san-dau-1.40.0]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Set up Android 35
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Verify APK output
        run: test -f app/build/outputs/apk/debug/app-debug-unsigned.apk

      - name: Collect APK signing tool
        run: |
          mkdir -p build/signing-tools
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" build/signing-tools/apksigner.jar

      - name: Upload APK for local signing
        uses: actions/upload-artifact@v4
        with:
          name: LiveSanDau-v1.40.0-unsigned
          path: |
            app/build/outputs/apk/debug/*.apk
            build/signing-tools/apksigner.jar
          if-no-files-found: error
          retention-days: 14
