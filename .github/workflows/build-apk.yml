name: Build Live San Dau APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Install Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Run unit tests
        continue-on-error: true
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Collect APK signing tool
        run: |
          mkdir -p build/signing-tools
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" build/signing-tools/apksigner.jar

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: LiveSanDau-v1.26-email-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            build/signing-tools/apksigner.jar
          if-no-files-found: error
          retention-days: 14
